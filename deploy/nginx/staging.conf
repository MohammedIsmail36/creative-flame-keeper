# Staging frontend bootstrap configuration.
# This HTTP server is required before issuing the TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name staging.alibea2020.com;

    root /var/www/staging.alibea2020.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. {
        deny all;
    }
}
