# Farida production frontend plus the isolated Staging frontend.
# Source of truth tracked in Git; validate with `sudo nginx -t` before reload.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name farida.alibea2020.com;
    return 301 https://$server_name$request_uri;
}

# SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farida.alibea2020.com;

    ssl_certificate /etc/letsencrypt/live/farida.alibea2020.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farida.alibea2020.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Isolated Staging SPA. /staging/* maps to /var/www/staging/*.
    # no-store prevents a stale test build from surviving between test rounds.
    location = /staging {
        return 301 /staging/;
    }

    location /staging/ {
        root /var/www;
        try_files $uri $uri/ /staging/index.html;
        add_header Cache-Control "no-store" always;
    }

    # Farida production frontend.
    location / {
        root /var/www/farida;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Farida self-hosted Supabase API (port 8000).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ /\. { deny all; }
}
